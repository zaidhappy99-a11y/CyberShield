<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | CyberShield</title>
    <meta name="description" content="Sign in to CyberShield to open your NetSentinel security dashboard.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a class="auth-back" href="index.html"><i class="fas fa-arrow-left"></i> Back to home</a>
            <div class="auth-header">
                <div class="auth-logo"><i class="fas fa-shield-halved"></i></div>
                <h1>Welcome back</h1>
                <p>Sign in to open your NetSentinel dashboard.</p>
            </div>
            <div id="formMessage" class="form-message" role="alert" hidden></div>
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <p class="field-hint">Use the email you registered with.</p>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group form-check">
                    <label class="check-label"><input type="checkbox" id="remember"> <span>Remember me on this device</span></label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block auth-btn" id="submitBtn">
                    <span class="btn-label">Sign in</span> <i class="fas fa-arrow-right btn-arrow"></i>
                </button>
                <p class="auth-next"><i class="fas fa-circle-info"></i> After signing in you'll land straight in NetSentinel — nothing else to set up.</p>
            </form>
            <div class="auth-footer">
                <p>New to CyberShield? <a href="register.html">Create a free account</a></p>
            </div>
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
