<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | CyberShield</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .member-row { display: flex; align-items: center; gap: 1rem; padding: .9rem 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); }
        .member-row + .member-row { margin-top: .75rem; }
        .member-role { font-size: .75rem; font-weight: 700; text-transform: uppercase; padding: .2rem .6rem; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
        .member-actions { margin-left: auto; display: flex; gap: .5rem; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a class="nav-logo" href="scanner.html"><i class="fas fa-shield-halved"></i><span>CyberShield</span></a><div class="sidebar-user"><strong class="sidebar-user-name">You</strong><small class="sidebar-user-email">you@example.com</small></div></div>
        <nav class="sidebar-nav">
            <a href="scanner.html" class="nav-item"><i class="fas fa-search"></i><span>Scanner</span></a>
            <a href="netsentinel.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>NetSentinel</span></a>
            <a href="vulnerabilities.html" class="nav-item"><i class="fas fa-bug"></i><span>Vulnerabilities</span></a>
            <a href="reports.html" class="nav-item"><i class="fas fa-file-alt"></i><span>Reports</span></a>
            <a href="team.html" class="nav-item active"><i class="fas fa-users-cog"></i><span>Team</span></a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-item logout-link"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></div>
    </aside>
    <main class="main-content">
        <header class="top-bar">
            <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <div class="top-bar-search"><i class="fas fa-search"></i><input type="text" id="topBarSearch" placeholder="Search members…" aria-label="Search"></div>
            <div class="top-bar-user">
                <div class="user-info"><span class="user-name">Loading…</span><span class="user-email">…</span></div>
                <div class="user-avatar"><img src="assets/images/avatar.svg" alt="User"></div>
                <a class="btn btn-outline btn-small logout-btn" href="login.html" aria-label="Sign out"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </header>
        <div class="dashboard-content">
            <div class="page-header"><h1>Team</h1><p>Who can see scans, reports, and alerts for your workspace.</p></div>
            <div class="card">
                <div class="card-header"><h3>Add member</h3></div>
                <div class="card-body">
                    <form id="addMemberForm" class="scan-form" style="max-width:640px">
                        <div class="form-group"><label for="nmName">Full name</label><div class="input-wrapper"><i class="fas fa-user"></i><input id="nmName" placeholder="Alex Carter" required></div></div>
                        <div class="form-group"><label for="nmEmail">Email</label><div class="input-wrapper"><i class="fas fa-envelope"></i><input id="nmEmail" type="email" placeholder="alex@example.com" required></div></div>
                        <div class="form-group"><label for="nmRole">Role</label><div class="input-wrapper"><i class="fas fa-shield-halved"></i>
                            <select id="nmRole" style="width:100%; padding:.8rem 2.75rem; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit">
                                <option value="Admin">Admin</option>
                                <option value="Analyst" selected>Analyst</option>
                                <option value="Viewer">Viewer</option>
                            </select>
                        </div></div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Add member</button>
                    </form>
                </div>
            </div>
            <div class="card" style="margin-top:1.5rem">
                <div class="card-header"><h3>Members</h3></div>
                <div class="card-body"><div id="memberList"></div></div>
            </div>
        </div>
    </main>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script>
    (function () {
        const seed = [
            { name: 'You', email: localStorage.getItem('netsentinel_user') || 'you@example.com', role: 'Admin', you: true },
            { name: 'Priya Nair', email: 'priya@cybershield.io', role: 'Analyst' },
            { name: 'Marcus Chen', email: 'marcus@cybershield.io', role: 'Viewer' },
        ];
        const KEY = 'cybershield_team';
        const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || seed; } catch { return seed; } };
        const save = (members) => localStorage.setItem(KEY, JSON.stringify(members));
        const render = () => {
            const members = load();
            const cat = document.getElementById('memberList');
            if (!members.length) { cat.innerHTML = '<p class="scanner-hint">No members yet — invite your team above.</p>'; return; }
            cat.innerHTML = members.map((m, i) => `
                <div class="member-row">
                    <div class="review-avatar">${(m.name || 'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
                    <div><strong>${m.name}${m.you ? ' (you)' : ''}</strong><br><small>${m.email}</small></div>
                    <span class="member-role">${m.role}</span>
                    <div class="member-actions">
                        ${m.you ? '<span class="scanner-hint">Owner</span>' : `<button class="btn btn-outline btn-small" data-idx="${i}" data-act="role"><i class="fas fa-sync"></i> Role</button><button class="btn btn-outline btn-small" data-idx="${i}" data-act="remove"><i class="fas fa-user-minus"></i></button>`}
                    </div>
                </div>`).join('');
            cat.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const members = load();
                    const i = Number(btn.dataset.idx);
                    if (!members[i]) return;
                    if (btn.dataset.act === 'remove') members.splice(i, 1);
                    else members[i].role = members[i].role === 'Analyst' ? 'Viewer' : 'Analyst';
                    save(members); render();
                });
            });
        };
        document.getElementById('addMemberForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = this.nmName.value.trim();
            const email = this.nmEmail.value.trim();
            if (!name || !email) return;
            const members = load();
            members.push({ name, email, role: this.nmRole.value, you: false });
            save(members); this.reset(); render();
        });
        render();
    })();
    </script>
</body>
</html>
