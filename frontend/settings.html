<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | CyberShield</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .settings-section { margin-bottom: 1.5rem; }
        .danger-zone { border: 1px solid #fecaca; background: #fef2f2; border-radius: var(--radius); padding: 1rem 1.25rem; }
        .danger-zone h3 { color: #b91c1c; font-size: 1rem; margin-bottom: .5rem; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a class="nav-logo" href="scanner.html"><i class="fas fa-shield-halved"></i><span>CyberShield</span></a><div class="sidebar-user"><strong class="sidebar-user-name">You</strong><small class="sidebar-user-email">you@example.com</small></div></div>
        <nav class="sidebar-nav">
            <a href="scanner.html" class="nav-item"><i class="fas fa-search"></i><span>Scanner</span></a>
            <a href="netsentinel.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>NetSentinel</span></a>
            <a href="vulnerabilities.html" class="nav-item"><i class="fas fa-bug"></i><span>Vulnerabilities</span></a>
            <a href="clients.html" class="nav-item"><i class="fas fa-address-book"></i><span>Clients</span></a>
            <a href="reports.html" class="nav-item"><i class="fas fa-file-alt"></i><span>Reports</span></a>
            <a href="team.html" class="nav-item"><i class="fas fa-users-cog"></i><span>Team</span></a>
            <a href="settings.html" class="nav-item active"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-item logout-link"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></div>
    </aside>
    <main class="main-content">
        <header class="top-bar">
            <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <div class="top-bar-search"><i class="fas fa-search"></i><input type="text" id="topBarSearch" placeholder="Search settings…" aria-label="Search"></div>
            <div class="top-bar-user">
                <div class="user-info"><span class="user-name">Loading…</span><span class="user-email">…</span></div>
                <div class="user-avatar"><img src="assets/images/avatar.svg" alt="User"></div>
                <a class="btn btn-outline btn-small logout-btn" href="login.html" aria-label="Sign out"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </header>
        <div class="dashboard-content">
            <div class="page-header"><h1>Settings</h1><p>Manage your profile, workspace, and preferences.</p></div>

            <div class="card settings-section">
                <div class="card-header"><h3>Profile</h3></div>
                <div class="card-body">
                    <form id="profileForm" class="scan-form">
                        <div class="form-group"><label for="setEmail">Email (sign-in)</label><div class="input-wrapper"><i class="fas fa-envelope"></i><input id="setEmail" type="email" disabled></div></div>
                        <div class="form-group"><label for="setDisplayName">Display name</label><div class="input-wrapper"><i class="fas fa-user"></i><input id="setDisplayName" type="text" placeholder="What should we call you?"></div></div>
                        <div class="form-group"><label for="setTimezone">Timezone</label><div class="input-wrapper"><i class="fas fa-globe"></i>
                            <select id="setTimezone" style="width:100%; padding:.8rem 2.75rem; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit">
                                <option>UTC</option><option>Asia/Kolkata</option><option>America/New_York</option><option>Europe/London</option>
                            </select>
                        </div></div>
                        <button type="submit" class="btn btn-primary">Save profile</button>
                    </form>
                </div>
            </div>

            <div class="card settings-section">
                <div class="card-header"><h3>Notifications</h3></div>
                <div class="card-body">
                    <label class="check-label" style="margin-bottom:.75rem"><input type="checkbox" id="notifCritical" checked> <span>Email me when a critical issue is found</span></label>
                    <label class="check-label" style="margin-bottom:.75rem"><input type="checkbox" id="notifWeekly" checked> <span>Weekly summary report (Mondays)</span></label>
                    <label class="check-label"><input type="checkbox" id="notifQuarentine" checked> <span>Alert me when an IP gets auto-quarantined</span></label>
                </div>
            </div>

            <div class="card settings-section danger-zone">
                <h3>Danger zone</h3>
                <p class="scanner-hint">Clearing demo data signs you out and wipes locally stored scans/team.</p>
                <button id="resetDemoBtn" class="btn btn-outline" style="border-color:#fecaca;color:#b91c1c"><i class="fas fa-trash-can"></i> Reset demo & sign out</button>
            </div>
        </div>
    </main>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script>
    (function () {
        var email = localStorage.getItem('netsentinel_user') || '';
        document.getElementById('setEmail').value = email;
        document.getElementById('setDisplayName').value = localStorage.getItem('cybershield_display_name') || '';
        document.getElementById('setTimezone').value = localStorage.getItem('cybershield_timezone') || 'UTC';
        document.getElementById('notifCritical').checked = localStorage.getItem('notifCritical') !== '0';
        document.getElementById('notifWeekly').checked = localStorage.getItem('notifWeekly') !== '0';
        document.getElementById('notifQuarentine').checked = localStorage.getItem('notifQuarentine') !== '0';
        document.getElementById('profileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            localStorage.setItem('cybershield_display_name', this.setDisplayName.value.trim());
            localStorage.setItem('cybershield_timezone', this.setTimezone.value);
            showToast('Profile saved', 'success');
        });
        ['notifCritical', 'notifWeekly', 'notifQuarentine'].forEach(function (id) {
            document.getElementById(id).addEventListener('change', function () { localStorage.setItem(id, this.checked ? '1' : '0'); });
        });
        document.getElementById('resetDemoBtn').addEventListener('click', function () {
            if (!confirm('Reset demo data and sign out?')) return;
            ['netsentinel_user','cybershield_display_name','cybershield_timezone','cybershield_team','notifCritical','notifWeekly','notifQuarentine'].forEach(function (k) { localStorage.removeItem(k); });
            window.location.href = 'login.html';
        });
    })();
    </script>
</body>
</html>
