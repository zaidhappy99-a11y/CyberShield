<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerabilities | CyberShield</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="nav-logo" href="scanner.html"><i class="fas fa-shield-halved"></i><span>CyberShield</span></a>
            <div class="sidebar-user"><strong class="sidebar-user-name">You</strong><small class="sidebar-user-email">you@example.com</small></div>
        </div>
        <nav class="sidebar-nav">
            <a href="scanner.html" class="nav-item"><i class="fas fa-search"></i><span>Scanner</span></a>
            <a href="netsentinel.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>NetSentinel</span></a>
            <a href="vulnerabilities.html" class="nav-item active"><i class="fas fa-bug"></i><span>Vulnerabilities</span></a>
            <a href="reports.html" class="nav-item"><i class="fas fa-file-alt"></i><span>Reports</span></a>
            <a href="team.html" class="nav-item"><i class="fas fa-users-cog"></i><span>Team</span></a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item logout-link"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>
    <main class="main-content">
        <header class="top-bar">
            <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
            <div class="top-bar-search"><i class="fas fa-search"></i><input type="text" id="topBarSearch" placeholder="Search alerts, pages, reports…" aria-label="Search"></div>
            <div class="top-bar-user">
                <div class="user-info"><span class="user-name">Loading…</span><span class="user-email">…</span></div>
                <div class="user-avatar"><img src="assets/images/avatar.svg" alt="User"></div>
                <a class="btn btn-outline btn-small logout-btn" href="login.html" aria-label="Sign out"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </header>
        <div class="dashboard-content">
            <div class="page-header"><h1>Vulnerabilities</h1><p>Every finding from your latest scan, explained in plain language.</p></div>
            <div class="card">
                <div class="card-header"><h3>Latest findings</h3><button class="btn btn-outline btn-small" id="refreshVulnsBtn"><i class="fas fa-rotate"></i> Refresh</button></div>
                <div class="card-body">
                    <div class="vuln-filter-row">
                        <button class="scan-type-option active" data-sev="ALL"><i class="fas fa-layer-group"></i> All</button>
                        <button class="scan-type-option" data-sev="CRITICAL"><i class="fas fa-skull-crossbones"></i> Critical</button>
                        <button class="scan-type-option" data-sev="HIGH"><i class="fas fa-triangle-exclamation"></i> High</button>
                        <button class="scan-type-option" data-sev="MEDIUM"><i class="fas fa-circle-exclamation"></i> Medium</button>
                        <button class="scan-type-option" data-sev="LOW"><i class="fas fa-circle-info"></i> Low</button>
                    </div>
                    <div id="vulnList" class="issues-list" style="margin-top:1rem"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script>
    (function () {
        // Simple demo dataset derived from the live /api/alerts feed
        const fallback = [
            { severity: 'CRITICAL', type: 'SQL Injection', target: '/login?u=admin', fix: 'Use parameterized queries' },
            { severity: 'HIGH', type: 'Cross-Site Scripting (XSS)', target: '/comment', fix: 'Sanitize all user input' },
            { severity: 'MEDIUM', type: 'Missing security header', target: 'Content-Security-Policy', fix: 'Add CSP header' },
            { severity: 'LOW', type: 'Verbose server banner', target: 'X-Powered-By', fix: 'Remove or mask server info' },
        ];
        const sevClass = { CRITICAL: 'danger', HIGH: 'warning', MEDIUM: 'info', LOW: 'low' };
        const sevLabel = { CRITICAL: 'Critical', HIGH: 'High', MEDIUM: 'Medium', LOW: 'Low' };
        let currentFilter = 'ALL';
        const list = document.getElementById('vulnList');
        const render = () => {
            const items = fallback.filter(v => currentFilter === 'ALL' || v.severity === currentFilter);
            if (!items.length) {
                list.innerHTML = '<div class="issue-item"><div class="issue-info"><h4>Nothing at this severity</h4><span class="issue-severity low">INFO</span></div><p class="issue-description">Great news — no findings here. Your scanner hero status is clean.</p></div>';
                return;
            }
            list.innerHTML = items.map(v => `
                <div class="issue-item">
                    <div class="issue-info"><h4>${v.type}</h4><span class="issue-severity ${sevClass[v.severity]}">${sevLabel[v.severity]}</span></div>
                    <div class="issue-target">${v.target}</div>
                    <p class="issue-description">${v.fix}</p>
                </div>`).join('');
        };
        document.querySelectorAll('.vuln-filter-row .scan-type-option').forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.sev;
                document.querySelectorAll('.vuln-filter-row .scan-type-option').forEach(b => b.classList.toggle('active', b === btn));
                render();
            });
        });
        document.getElementById('refreshVulnsBtn').addEventListener('click', () => {
            if (typeof API !== 'undefined') {
                API.getAlerts(20, 'ALL').then(render).catch(() => render());
            } else {
                render();
            }
        });
        render();
    })();
    </script>
</body>
</html>
